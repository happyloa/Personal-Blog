name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 這個工作流只需要讀取原始碼，明確收斂權限作為縱深防禦。
permissions:
  contents: read

# 同一分支連續推送時取消尚未跑完的舊建置，避免佇列堆積。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
